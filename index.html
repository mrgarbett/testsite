<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=1440, height=3120, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Android Webapp Demo</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @font-face {
            font-family: 'Circular';
            src: url('ttfs/CircularStd-Book.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Circular';
            src: url('ttfs/CircularStd-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Circular';
            src: url('ttfs/CircularStd-Black.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --top-info-margin-bottom: 80px;
            --top-info-margin-top: 80px;
            --card-width: 87vw;
            --card-height: 80vh;
            --top-info-margin-left: -100px;
            --card-header-margin-top: -100px;
            --card-header-padding-bottom: 80px;
            --banner-margin-top: 50px;
            --ticket-expiry-margin-top: 150px;
            --hash-banner-margin-top: 150px;
            --details-link-margin-top: 150px;
            --top-rect-radius: 40px;
            --top-info-width: calc(100%);
            /* Preset colors: edit these hex values to change the six presets */
            --preset-color-1: #e91e63;
            --preset-color-2: #03a9f4;
            --preset-color-3: #44cf8c;
            --preset-color-4: #ff9800;
            --preset-color-5: #959595;
            --preset-color-6: #cccccd; /* placeholder hex */
            /* Preset color names: edit these to change the label shown in the dropdown */
            --preset-name-1: Pink;
            --preset-name-2: Blue;
            --preset-name-3: Green;
            --preset-name-4: Orange;
            --preset-name-5: Gray;
            --preset-name-6: Placeholder;
        }
        body {
            margin: 0;
            height: 100vh;
            background: #1976d2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Circular', 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            font-weight: bold;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            width: var(--card-width);
            height: var(--card-height);
            max-width: 100vw;
            max-height: 98vh;
            min-width: 320px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 24px 0 24px;
            font-family: inherit;
        }
        .hello-input {
            font-size: 2rem;
            padding: 18px;
            border: 1px solid #ccc;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 12px;
            font-weight: bold;
            background: transparent;
            color: #222;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="container" style="position:relative; overflow:hidden;">
                        <!-- Top info rectangle -->
                        <div id="top-info" style="width:var(--top-info-width); margin-left:var(--top-info-margin-left); margin-top:var(--top-info-margin-top); margin-bottom:var(--top-info-margin-bottom); height:180px; background:#1976d2; display:flex; align-items:center; position:relative; border-top-left-radius:0px!important; border-bottom-left-radius:0px!important; border-top-right-radius:var(--top-rect-radius, 85px); border-bottom-right-radius:var(--top-rect-radius, 85px); top:0;">
                                <!-- Student icon SVG -->
                                <div style="margin-left:48px; margin-right:12px; display:flex; align-items:center;">
                                    <img src="ttfs/student.svg" alt="Student Icon" style="width:88px; height:88px; filter:invert(1) brightness(2);">
                                </div>
                                <span style="color:#fff; font-size:4.2rem; font-weight:bold; margin-right:auto; padding-left:32px; white-space:nowrap;">Rodrigo Macias</span>
                                <input type="text" value="£12.50" style="color:#fff; font-size:4.2rem; font-weight:bold; margin-right:38px; background:transparent; border:none; text-align:right; font-family:'Circular', 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; width:200px;">
                        </div>
                        <div id="qr-wrapper" style="width:100%; display:flex; justify-content:center; align-items:flex-start; height:33%;">
                            <div id="qr" style="display:flex; justify-content:center; align-items:center;"></div>
                        </div>
        <div id="card-header" style="width:100%; display:flex; flex-direction:column; align-items:center; margin-top:var(--card-header-margin-top); padding-bottom:var(--card-header-padding-bottom);">
    <textarea rows="2" style="font-size:5.6rem; color:#111; font-weight:bold; font-family:'Circular', 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; text-align:center; text-shadow:0 2px 8px rgba(0,0,0,0.10); letter-spacing:0.02em; border:none; background:transparent; opacity:1; resize:none;">Dundee 7 day student
MegaRider</textarea>
    <span id="valid-date" style="font-size:3.2rem; color:#222; font-weight:bold; margin-top:40px; text-align:center; text-shadow:0 1px 6px rgba(0,0,0,0.08); letter-spacing:0.01em;"> </span>
            </div>
            <!-- Banner overlay, full width of card, with drop shadow -->
    <div id="banner" style="width:calc(100% + 120px); margin-left:-60px; height:260px; display:flex; align-items:center; justify-content:center; margin-top:var(--banner-margin-top); position:relative; border-radius:0; overflow:hidden; box-shadow:0 8px 32px 0 rgba(0,0,0,0.28); z-index:10;">
                <canvas id="bubble-canvas" width="960" height="180" style="position:absolute; left:10%; top:0; width:80%; height:100%; pointer-events:none;"></canvas>
    <div id="banner-content-word" style="width:100%; text-align:center; color:#111; font-size:10.2rem; font-weight:normal; font-family:'Circular', 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; opacity:1; transition:opacity 0.7s; position:absolute; z-index:1; left:0; top:0; height:100%; display:flex; align-items:center; justify-content:center;"></div>
    <div id="banner-content-clock" style="width:100%; text-align:center; color:#111; font-size:10.2rem; font-weight:normal; font-family:'Circular', 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; opacity:0; transition:opacity 0.7s; position:absolute; z-index:2; left:0; top:0; height:100%; display:flex; align-items:center; justify-content:center;"></div>
            </div>
            <!-- Banner controls -->
            <div id="banner-controls" style="position:absolute; left:0; right:0; top:calc(100% - 64px); width:100%; display:flex; justify-content:center; gap:12px; z-index:11; pointer-events:auto; align-items:center;">
                <select id="preset-colors" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); height:48px; border-radius:12px; padding:8px 12px; font-size:1.6rem; background:transparent; color:#111; border:1px solid rgba(0,0,0,0.08); opacity:0;">
                    <option value="">Presets</option>
                </select>
                <input id="background-color" type="color" value="#1976d2" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); height:48px; width:48px; border:none; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,0.08); background:transparent; opacity:0;">
                <input id="banner-color" type="color" value="#e91e63" style="height:48px; width:48px; border:none; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,0.08); background:transparent; opacity:0;">
                <input id="banner-word" type="text" placeholder="Enter word" style="font-size:2rem; padding:18px 20px; border-radius:12px; border:1px solid #ccc; width:220px; font-weight:bold; background:transparent; color:#222; opacity:0;">
            </div>
        <!-- Ticket expiry field -->
    <div id="ticket-expiry" style="width:100%; text-align:center; font-size:3.2rem; color:#222; font-weight:normal; margin-top:var(--ticket-expiry-margin-top); font-family:'Circular', 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;"></div>
        <!-- Squircle hash banner -->
    <div id="hash-banner" style="width:100%; height:72px; margin-top:var(--hash-banner-margin-top); display:flex; align-items:center; justify-content:center; background:#1a1a1a1a; color:#222; font-size:3.2rem; font-weight:normal; border-radius:100px; letter-spacing:0.04em; font-family:'Circular', 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;"></div>
        <!-- More details hyperlink -->
    <div style="width:100%; display:flex; justify-content:center; margin-top:var(--details-link-margin-top);">
    <a href="#" style="color:#16813d; font-size:3.2rem; font-weight:normal; font-family:'Circular', 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; text-decoration:none;">More details &gt;</a>
        </div>
        </div>
        </div>
        <script>
            // Register service worker for PWA/offline support
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js');
            }
            // Variable to control QR code scale
            const qrScale = 1.5; // Change this value to scale the QR code (was 1.0)
            const baseSize = 480; // base size in px
            const size = baseSize * qrScale;
            // Generate a real QR code using QRCode.js
            const qrContainer = document.getElementById('qr');
            function randomQRText() {
                // Generate a moderately long, complex random string for QR code
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+[]{}|;:,.<>?/~';
                let str = 'Dundee MegaRider ';
                for (let i = 0; i < 220; i++) str += chars[Math.floor(Math.random() * chars.length)];
                return str;
            }
            function renderQRCode(text) {
                qrContainer.innerHTML = '';
                // Use a larger QR version (typeNumber: 10)
                new QRCode(qrContainer, {
                    text: text,
                    width: size,
                    height: size,
                    colorDark : "#222",
                    colorLight : "#fff",
                    correctLevel : QRCode.CorrectLevel.H,
                    typeNumber: 40 // Largest QR type
                });
            }
            let currentQRText = randomQRText();
            renderQRCode(currentQRText);
            setInterval(() => {
                currentQRText = randomQRText();
                renderQRCode(currentQRText);
            }, 10000);
                        // Set valid from date (current date minus 3 days)
                        const now = new Date();
                        const validDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 3);
                        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sept", "Oct", "Nov", "Dec"];
                        const formatted = `${validDate.getDate()} ${monthNames[validDate.getMonth()]} ${validDate.getFullYear()}`;
                        document.getElementById('valid-date').textContent = `Valid from 00:00, ${formatted}`;

                        // Ticket expiry field
                        function updateExpiryField() {
                            const nowDynamic = new Date();
                            // Target: 4 days from now, at 04:00 am
                            const expiryDate = new Date(nowDynamic.getFullYear(), nowDynamic.getMonth(), nowDynamic.getDate() + 4, 4, 0, 0, 0);
                            const diff = expiryDate - nowDynamic;
                            if (diff > 0) {
                                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                                const seconds = Math.floor((diff / 1000) % 60);
                                document.getElementById('ticket-expiry').textContent = `Ticket expires: in: ${days}d: ${hours}h: ${minutes}m: ${seconds}s`;
                            } else {
                                document.getElementById('ticket-expiry').textContent = 'Ticket expired';
                            }
                        }
                        updateExpiryField();
                        setInterval(updateExpiryField, 1000);

                        // Banner logic
                        const banner = document.getElementById('banner');
                        const bannerContentWord = document.getElementById('banner-content-word');
                        const bannerContentClock = document.getElementById('banner-content-clock');
                        const bannerColorInput = document.getElementById('banner-color');
                        const backgroundColorInput = document.getElementById('background-color');
                        const bannerWordInput = document.getElementById('banner-word');
                        
                        // Background color control
                        backgroundColorInput.addEventListener('input', (event) => {
                            document.body.style.background = event.target.value;
                        });
                        let userWord = '';
                        let showTime = true;
                        let crossfadeInterval = 1800; // ms

                        function updateBannerContent() {
                            if (showTime) {
                                const t = new Date();
                                bannerContentClock.textContent = t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                            } else {
                                bannerContentWord.textContent = userWord || ' ';
                            }
                        }

                        // Squircle hash banner logic
                        function randomHash() {
                            // Four random numbers
                            const fourNums = Array.from({length: 4}, () => Math.floor(Math.random() * 10)).join('');
                            // Date in YYYYMMDD, 4 days subtracted
                            const now = new Date();
                            now.setDate(now.getDate() - 4);
                            const yyyy = now.getFullYear();
                            const mm = String(now.getMonth() + 1).padStart(2, '0');
                            const dd = String(now.getDate()).padStart(2, '0');
                            const dateStr = `${yyyy}${mm}${dd}`;
                            // Random time in HHMMSS
                            const hh = String(Math.floor(Math.random() * 24)).padStart(2, '0');
                            const min = String(Math.floor(Math.random() * 60)).padStart(2, '0');
                            const ss = String(Math.floor(Math.random() * 60)).padStart(2, '0');
                            const timeStr = `${hh}${min}${ss}`;
                            // Three random numbers
                            const threeNums = Array.from({length: 3}, () => Math.floor(Math.random() * 10)).join('');
                            // Five random alphanumeric (caps or small)
                            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                            let fiveAlnum = '';
                            for (let i = 0; i < 5; i++) fiveAlnum += chars[Math.floor(Math.random() * chars.length)];
                            // Final format
                            return `${fourNums}-${dateStr}${timeStr}${threeNums}-${fiveAlnum}`;
                        }
                        function updateHashBanner() {
                            document.getElementById('hash-banner').textContent = randomHash();
                        }
                        updateHashBanner();
                        // Removed setInterval for hash banner update

                        // Bubble animation over banner
                        const bubbleCanvas = document.getElementById('bubble-canvas');
bubbleCanvas.width = Math.floor(document.getElementById('banner').offsetWidth * 0.7);
bubbleCanvas.height = document.getElementById('banner').offsetHeight;
bubbleCanvas.style.width = bubbleCanvas.width + 'px';
bubbleCanvas.style.height = bubbleCanvas.height + 'px';
bubbleCanvas.style.left = '15%';
bubbleCanvas.style.position = 'absolute';
                        const ctx = bubbleCanvas.getContext('2d');
                        let bubbles = [];
                        function spawnBubble() {
                            const minRadius = 20;
                            const maxRadius = 180;
                            const radius = Math.random() * (maxRadius - minRadius) + minRadius;
                            const speed = Math.random() * 2.5 + 1.2;
                            const alpha = Math.random() * 0.3 + 0.25;
                            // Random direction in radians
                            const angle = Math.random() * 2 * Math.PI;
                            const dx = Math.cos(angle) * speed;
                            const dy = Math.sin(angle) * speed;
                            // Spawn off-canvas: randomly pick an edge
                            let x, y;
                            const edge = Math.floor(Math.random() * 4);
                            if (edge === 0) { // left
                                x = -radius;
                                y = Math.random() * bubbleCanvas.height;
                            } else if (edge === 1) { // right
                                x = bubbleCanvas.width + radius;
                                y = Math.random() * bubbleCanvas.height;
                            } else if (edge === 2) { // top
                                x = Math.random() * bubbleCanvas.width;
                                y = -radius;
                            } else { // bottom
                                x = Math.random() * bubbleCanvas.width;
                                y = bubbleCanvas.height + radius;
                            }
                            bubbles.push({x, y, radius, dx, dy, alpha});
                        }
                        function animateBubbles() {
                            ctx.clearRect(0, 0, bubbleCanvas.width, bubbleCanvas.height);
                            bubbles.forEach(b => {
                                ctx.beginPath();
                                ctx.arc(b.x, b.y, b.radius, 0, 2 * Math.PI);
                                ctx.fillStyle = `rgba(255,255,255,${b.alpha})`;
                                ctx.fill();
                                b.x += b.dx;
                                b.y += b.dy;
                            });
                            // Remove bubbles that are out of view
                            bubbles = bubbles.filter(b =>
                                b.x + b.radius > 0 && b.x - b.radius < bubbleCanvas.width &&
                                b.y + b.radius > 0 && b.y - b.radius < bubbleCanvas.height
                            );
                            // Spawn new bubbles randomly
                            if (Math.random() < 0.07) spawnBubble(); // Higher density
                            requestAnimationFrame(animateBubbles);
                        }
                        animateBubbles();

                        // Crossfade logic
                        setInterval(() => {
                            const overlap = 150; // ms, reduced overlap
                            const transition = 700; // ms, match CSS
                            if (showTime) {
                                bannerContentClock.style.opacity = 1;
                                bannerContentWord.style.opacity = 1;
                                setTimeout(() => {
                                    bannerContentWord.style.opacity = 0;
                                }, overlap);
                            } else {
                                bannerContentWord.style.opacity = 1;
                                bannerContentClock.style.opacity = 1;
                                setTimeout(() => {
                                    bannerContentClock.style.opacity = 0;
                                }, overlap);
                            }
                            setTimeout(() => {
                                showTime = !showTime;
                                updateBannerContent();
                            }, transition);
                        }, crossfadeInterval);

                        // Update time every second if showing time
                        setInterval(() => {
                            if (showTime) {
                                const t = new Date();
                                bannerContentClock.textContent = t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                            }
                        }, 1000);

                        bannerWordInput.addEventListener('input', e => {
                            userWord = e.target.value;
                            // persist the banner word
                            try { localStorage.setItem('bannerWord', userWord); } catch (err) {}
                            if (!showTime) {
                                bannerContentWord.textContent = userWord || ' ';
                            }
                        });

                        bannerColorInput.addEventListener('input', e => {
                            banner.style.background = e.target.value;
                        });
                        // Initial banner color
                        banner.style.background = bannerColorInput.value;

                        // Preset colors wiring using native <select>
                        (function setupPresets(){
                            const root = getComputedStyle(document.documentElement);
                            const presets = [
                                root.getPropertyValue('--preset-color-1').trim() || '#e91e63',
                                root.getPropertyValue('--preset-color-2').trim() || '#1976d2',
                                root.getPropertyValue('--preset-color-3').trim() || '#22c55e',
                                root.getPropertyValue('--preset-color-4').trim() || '#ff9800',
                                root.getPropertyValue('--preset-color-5').trim() || '#9c27b0',
                                root.getPropertyValue('--preset-color-6').trim() || '#03a9f4'
                            ];
                            const names = [
                                root.getPropertyValue('--preset-name-1').trim() || 'Pink',
                                root.getPropertyValue('--preset-name-2').trim() || 'Blue',
                                root.getPropertyValue('--preset-name-3').trim() || 'Green',
                                root.getPropertyValue('--preset-name-4').trim() || 'Orange',
                                root.getPropertyValue('--preset-name-5').trim() || 'Purple',
                                root.getPropertyValue('--preset-name-6').trim() || 'Cyan'
                            ];

                            const select = document.getElementById('preset-colors');
                            // populate select (leave first option as default)
                            presets.forEach((hex, i) => {
                                const opt = document.createElement('option');
                                opt.value = hex;
                                // Use the user-editable name if present, otherwise fall back to hex
                                opt.textContent = names[i] || hex;
                                select.appendChild(opt);
                            });

                            // when a preset is chosen, update the banner and color input and persist
                            select.addEventListener('change', e => {
                                const val = e.target.value;
                                if (val) {
                                    banner.style.background = val;
                                    bannerColorInput.value = val;
                                    try { localStorage.setItem('presetColor', val); } catch (err) {}
                                }
                            });

                            // When color input changes manually, try to sync select and persist
                            bannerColorInput.addEventListener('input', e => {
                                const val = e.target.value;
                                banner.style.background = val;
                                const matchIdx = presets.indexOf(val);
                                if (matchIdx >= 0) select.selectedIndex = matchIdx + 1; // +1 because of default option
                                else select.selectedIndex = 0;
                                try { localStorage.setItem('presetColor', val); } catch (err) {}
                            });

                            // Restore persisted preset color if any
                            try {
                                const saved = localStorage.getItem('presetColor');
                                if (saved) {
                                    banner.style.background = saved;
                                    bannerColorInput.value = saved;
                                    const matchIdx = presets.indexOf(saved);
                                    if (matchIdx >= 0) select.selectedIndex = matchIdx + 1;
                                }
                            } catch (err) {}

                            // Restore persisted banner word if any
                            try {
                                const savedWord = localStorage.getItem('bannerWord');
                                if (savedWord) {
                                    userWord = savedWord;
                                    bannerWordInput.value = userWord;
                                    if (!showTime) bannerContentWord.textContent = userWord || ' ';
                                }
                            } catch (err) {}

                        })();

                        // Gyro effect
                        function handleGyro(event) {
                            const gamma = event.gamma || 0; // left/right tilt
                            const beta = event.beta || 0;  // up/down tilt
                            // Map gamma [-45,45] to [-30,30] px (increased sensitivity)
                            const x = Math.max(-30, Math.min(30, gamma/45*30));
                            // Map beta [0,90] to [-15,15] px (increased sensitivity)
                            const y = Math.max(-15, Math.min(15, (beta-45)/45*15));
                            // Map gamma [-90,90] to [-60,60] deg for rotation
                            const rotate = Math.max(-60, Math.min(60, gamma/90*60));
                            banner.style.transform = `translate(${x}px, ${y}px) rotate(${rotate}deg)`;
                        }
                        if (window.DeviceOrientationEvent) {
                            window.addEventListener('deviceorientation', handleGyro);
                        }

                        // Initial content
                        updateBannerContent();
                    </script>
</body>
</html>
