<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=1440, height=3120, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Android Webapp Demo</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @font-face {
            font-family: 'Circular';
            src: url('ttfs/CircularStd-Book.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Circular';
            src: url('ttfs/CircularStd-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --top-info-margin-bottom: 80px;
            --top-info-margin-top: 80px;
            --card-header-margin-top: -200px;
            --card-header-padding-bottom: 32px;
            --banner-margin-top: 50px;
            --ticket-expiry-margin-top: 150px;
            --hash-banner-margin-top: 150px;
            --details-link-margin-top: 150px;
        }
        body {
            margin: 0;
            height: 100vh;
            background: #1976d2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Circular', 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            width: 87vw;
            height: 95vh;
            max-width: 100vw;
            max-height: 98vh;
            min-width: 320px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 24px 0 24px;
            font-family: inherit;
        }
        .hello-input {
            font-size: 1.2rem;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container" style="position:relative; overflow:hidden;">
                        <!-- Top info rectangle -->
                        <script>
                            // Adjustable corner radius for top rectangle
                            var topRectRadius = 14; // px, change as needed
                        </script>
                        <div id="top-info" style="width:calc(100% + 32px); margin-left:-64px; margin-top:var(--top-info-margin-top); margin-bottom:var(--top-info-margin-bottom); height:140px; background:#1976d2; display:flex; align-items:center; position:relative; border-top-left-radius:0px!important; border-bottom-left-radius:0px!important; border-top-right-radius:85px; border-bottom-right-radius:85px; box-shadow:0 2px 8px rgba(0,0,0,0.07); top:0;">
                                <!-- Student icon SVG -->
                                <div style="margin-left:48px; margin-right:12px; display:flex; align-items:center;">
                                    <img src="ttfs/student.svg" alt="Student Icon" style="width:56px; height:56px; filter:invert(1) brightness(2);">
                                </div>
                                <span style="color:#fff; font-size:4.2rem; font-weight:normal; margin-right:auto; padding-left:32px;">Rodrigo Macias</span>
                                <span style="color:#fff; font-size:4.2rem; font-weight:normal; margin-right:38px;">£12.50</span>
                        </div>
                        <script>
                            // Set the corner radius dynamically
                            document.getElementById('top-info').style.borderRadius = topRectRadius + 'px';
                        </script>
                        <div id="qr-wrapper" style="width:100%; display:flex; justify-content:center; align-items:flex-start; height:33%;">
                            <div id="qr" style="display:flex; justify-content:center; align-items:center;"></div>
                        </div>
        <div id="card-header" style="width:100%; display:flex; flex-direction:column; align-items:center; margin-top:var(--card-header-margin-top); padding-bottom:var(--card-header-padding-bottom);">
    <span style="font-size:5.2rem; color:#111; font-weight:bold; text-align:center; text-shadow:0 2px 8px rgba(0,0,0,0.10); letter-spacing:0.02em;">Dundee 7 day student<br>MegaRider</span>
    <span id="valid-date" style="font-size:3.2rem; color:#222; font-weight:normal; margin-top:40px; text-align:center; text-shadow:0 1px 6px rgba(0,0,0,0.08); letter-spacing:0.01em;"> </span>
            </div>
            <!-- Banner overlay, full width of card, with drop shadow -->
    <div id="banner" style="width:calc(100% + 120px); margin-left:-60px; height:210px; display:flex; align-items:center; justify-content:center; margin-top:var(--banner-margin-top); position:relative; border-radius:0; overflow:hidden; box-shadow:0 4px 16px 0 rgba(0,0,0,0.18); z-index:10;">
                <canvas id="bubble-canvas" width="960" height="180" style="position:absolute; left:10%; top:0; width:80%; height:100%; pointer-events:none;"></canvas>
    <div id="banner-content" style="width:100%; text-align:center; color:#111; font-size:8.2rem; font-weight:normal; font-family:'Circular', 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; opacity:1; transition:opacity 0.7s; position:relative; z-index:1; line-height:210px;"></div>
            </div>
            <!-- Banner controls -->
            <div id="banner-controls" style="position:absolute; left:0; right:0; top:calc(100% - 64px); width:100%; display:flex; justify-content:center; gap:12px; z-index:11; pointer-events:auto;">
                <input id="banner-color" type="color" value="#e91e63" style="height:32px; width:32px; border:none; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,0.08);">
                <input id="banner-word" type="text" placeholder="Enter word" style="font-size:1rem; padding:6px 10px; border-radius:6px; border:1px solid #ccc; width:120px;">
            </div>
        <!-- Ticket expiry field -->
    <div id="ticket-expiry" style="width:100%; text-align:center; font-size:3.2rem; color:#222; font-weight:normal; margin-top:var(--ticket-expiry-margin-top);"></div>
        <!-- Squircle hash banner -->
    <div id="hash-banner" style="width:100%; height:72px; margin-top:var(--hash-banner-margin-top); display:flex; align-items:center; justify-content:center; background:#1a1a1a1a; color:#222; font-size:3.2rem; font-weight:normal; border-radius:100px; letter-spacing:0.04em;"></div>
        <!-- More details hyperlink -->
    <div style="width:100%; display:flex; justify-content:center; margin-top:var(--details-link-margin-top);">
    <a href="#" style="color:#22c55e; font-size:3.2rem; font-weight:normal; text-decoration:none;">More details &gt;</a>
        </div>
        </div>
        </div>
        <script>
            // Variable to control QR code scale
            const qrScale = 1.5; // Change this value to scale the QR code (was 1.0)
            const baseSize = 480; // base size in px
            const size = baseSize * qrScale;
            // Generate a real QR code using QRCode.js
            const qrContainer = document.getElementById('qr');
            function randomQRText() {
                // Generate a moderately long, complex random string for QR code
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+[]{}|;:,.<>?/~';
                let str = 'Dundee MegaRider ';
                for (let i = 0; i < 220; i++) str += chars[Math.floor(Math.random() * chars.length)];
                return str;
            }
            function renderQRCode(text) {
                qrContainer.innerHTML = '';
                // Use a larger QR version (typeNumber: 10)
                new QRCode(qrContainer, {
                    text: text,
                    width: size,
                    height: size,
                    colorDark : "#222",
                    colorLight : "#fff",
                    correctLevel : QRCode.CorrectLevel.H,
                    typeNumber: 40 // Largest QR type
                });
            }
            let currentQRText = randomQRText();
            renderQRCode(currentQRText);
            setInterval(() => {
                currentQRText = randomQRText();
                renderQRCode(currentQRText);
            }, 10000);
                        // Set valid from date (current date minus 3 days)
                        const now = new Date();
                        const validDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 3);
                        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sept", "Oct", "Nov", "Dec"];
                        const formatted = `${validDate.getDate()} ${monthNames[validDate.getMonth()]} ${validDate.getFullYear()}`;
                        document.getElementById('valid-date').textContent = `Valid from 00:00, ${formatted}`;

                        // Ticket expiry field
                        function updateExpiryField() {
                            const nowDynamic = new Date();
                            // Target: 4 days from now, at 04:00 am
                            const expiryDate = new Date(nowDynamic.getFullYear(), nowDynamic.getMonth(), nowDynamic.getDate() + 4, 4, 0, 0, 0);
                            const diff = expiryDate - nowDynamic;
                            if (diff > 0) {
                                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                                const seconds = Math.floor((diff / 1000) % 60);
                                document.getElementById('ticket-expiry').textContent = `Ticket expires: in: ${days}d: ${hours}h: ${minutes}m: ${seconds}s`;
                            } else {
                                document.getElementById('ticket-expiry').textContent = 'Ticket expired';
                            }
                        }
                        updateExpiryField();
                        setInterval(updateExpiryField, 1000);

                        // Banner logic
                        const banner = document.getElementById('banner');
                        const bannerContent = document.getElementById('banner-content');
                        const bannerColorInput = document.getElementById('banner-color');
                        const bannerWordInput = document.getElementById('banner-word');
                        let userWord = '';
                        let showTime = true;
                        let crossfadeInterval = 1800; // ms

                        function updateBannerContent() {
                            if (showTime) {
                                const t = new Date();
                                bannerContent.textContent = t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                            } else {
                                bannerContent.textContent = userWord || ' ';
                            }
                        }

                        // Squircle hash banner logic
                        function randomHash() {
                            // Four random numbers
                            const fourNums = Array.from({length: 4}, () => Math.floor(Math.random() * 10)).join('');
                            // Date in YYYYMMDD, 4 days subtracted
                            const now = new Date();
                            now.setDate(now.getDate() - 4);
                            const yyyy = now.getFullYear();
                            const mm = String(now.getMonth() + 1).padStart(2, '0');
                            const dd = String(now.getDate()).padStart(2, '0');
                            const dateStr = `${yyyy}${mm}${dd}`;
                            // Random time in HHMMSS
                            const hh = String(Math.floor(Math.random() * 24)).padStart(2, '0');
                            const min = String(Math.floor(Math.random() * 60)).padStart(2, '0');
                            const ss = String(Math.floor(Math.random() * 60)).padStart(2, '0');
                            const timeStr = `${hh}${min}${ss}`;
                            // Three random numbers
                            const threeNums = Array.from({length: 3}, () => Math.floor(Math.random() * 10)).join('');
                            // Five random alphanumeric (caps or small)
                            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                            let fiveAlnum = '';
                            for (let i = 0; i < 5; i++) fiveAlnum += chars[Math.floor(Math.random() * chars.length)];
                            // Final format
                            return `${fourNums}-${dateStr}${timeStr}${threeNums}-${fiveAlnum}`;
                        }
                        function updateHashBanner() {
                            document.getElementById('hash-banner').textContent = randomHash();
                        }
                        updateHashBanner();
                        // Removed setInterval for hash banner update

                        // Bubble animation over banner
                        const bubbleCanvas = document.getElementById('bubble-canvas');
                        bubbleCanvas.width = 1600; // scale up canvas width
bubbleCanvas.height = 320; // scale up bubbleCanvas height
                        const ctx = bubbleCanvas.getContext('2d');
                        let bubbles = [];
                        function spawnBubble() {
                            const minRadius = 20;
                            const maxRadius = 180;
                            const radius = Math.random() * (maxRadius - minRadius) + minRadius; // Bubbles range from 20px to 180px
                            const x = Math.random() * bubbleCanvas.width;
                            const y = bubbleCanvas.height + radius;
                            const speed = Math.random() * 3.2 + 2.2; // Even faster bubbles
                            const alpha = Math.random() * 0.3 + 0.25;
                            bubbles.push({x, y, radius, speed, alpha});
                        }
                        function animateBubbles() {
                            ctx.clearRect(0, 0, bubbleCanvas.width, bubbleCanvas.height);
                            bubbles.forEach(b => {
                                ctx.beginPath();
                                ctx.arc(b.x, b.y, b.radius, 0, 2 * Math.PI);
                                ctx.fillStyle = `rgba(255,255,255,${b.alpha})`;
                                ctx.fill();
                                b.y -= b.speed;
                                b.x += Math.sin(b.y/20) * 0.5;
                            });
                            // Remove bubbles that are out of view
                            bubbles = bubbles.filter(b => b.y + b.radius > 0);
                            // Spawn new bubbles randomly
                            if (Math.random() < 0.07) spawnBubble(); // Higher density
                            requestAnimationFrame(animateBubbles);
                        }
                        animateBubbles();

                        // Crossfade logic
                        setInterval(() => {
                            bannerContent.style.opacity = 0;
                            setTimeout(() => {
                                showTime = !showTime;
                                updateBannerContent();
                                bannerContent.style.opacity = 1;
                            }, 350);
                        }, crossfadeInterval);

                        // Update time every second if showing time
                        setInterval(() => {
                            if (showTime) updateBannerContent();
                        }, 1000);

                        bannerWordInput.addEventListener('input', e => {
                            userWord = e.target.value;
                            if (!showTime) {
                                bannerContent.style.opacity = 0;
                                setTimeout(() => {
                                    updateBannerContent();
                                    bannerContent.style.opacity = 1;
                                }, 350);
                            }
                        });

                        bannerColorInput.addEventListener('input', e => {
                            banner.style.background = e.target.value;
                        });
                        // Initial banner color
                        banner.style.background = bannerColorInput.value;

                        // Gyro effect
                        function handleGyro(event) {
                            // Use gamma for left/right tilt, beta for up/down
                            const gamma = event.gamma || 0;
                            const beta = event.beta || 0;
                            // Map gamma [-45,45] to [-20,20] px
                            const x = Math.max(-20, Math.min(20, gamma/45*20));
                            // Map beta [0,90] to [-10,10] px
                            const y = Math.max(-10, Math.min(10, (beta-45)/45*10));
                            banner.style.transform = `translate(${x}px, ${y}px)`;
                        }
                        if (window.DeviceOrientationEvent) {
                            window.addEventListener('deviceorientation', handleGyro);
                        }

                        // Initial content
                        updateBannerContent();
                    </script>
</body>
</html>
